<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — The Wuskaloosa Report</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏈</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/easymde/2.18.0/easymde.min.css">
  <style>
    /* ─── Tokens ─── */
    :root {
      --cr: #8f1224;
      --deep: #171313;
      --paper: #f8f6f1;
      --line: #ded9d0;
      --muted: #706a64;
      --success-bg: #d1fae5; --success-fg: #065f46;
      --error-bg: #fee2e2;   --error-fg: #991b1b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--paper); color: var(--deep); min-height: 100vh; }

    /* ─── Utilities ─── */
    .hidden { display: none !important; }

    /* ─── Buttons ─── */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 9px 18px; font-size: 13px; font-weight: 700;
      border: none; border-radius: 2px; cursor: pointer; letter-spacing: .04em;
      transition: opacity .15s;
    }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn-primary  { background: var(--cr); color: #fff; }
    .btn-white    { background: #fff; color: var(--cr); }
    .btn-ghost    { background: rgba(255,255,255,.18); color: #fff; border: 1px solid rgba(255,255,255,.35); }
    .btn-outline  { background: transparent; color: var(--cr); border: 1.5px solid var(--cr); }
    .btn-danger   { background: #dc2626; color: #fff; }
    .btn-sm       { padding: 6px 13px; font-size: 12px; }

    /* ─── Form fields ─── */
    label.lbl {
      display: block; font-size: 11px; font-weight: 700;
      letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin-bottom: 5px;
    }
    .field { margin-bottom: 18px; }
    input[type=text], input[type=password], input[type=datetime-local],
    textarea, select {
      width: 100%; padding: 10px 12px;
      border: 1px solid var(--line); border-radius: 2px;
      font-size: 14px; font-family: 'Inter', sans-serif;
      background: #fff; color: var(--deep);
      transition: border-color .15s;
    }
    input:focus, textarea:focus, select:focus {
      outline: none; border-color: var(--cr); box-shadow: 0 0 0 3px rgba(143,18,36,.08);
    }
    textarea { resize: vertical; min-height: 72px; }

    /* ─── Toolbar ─── */
    .toolbar {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; gap: 10px;
      padding: 0 24px; height: 54px;
      background: var(--cr); color: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,.25);
    }
    .toolbar-brand {
      font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 17px;
      letter-spacing: .06em; flex: 1;
    }
    .toolbar-brand span { font-weight: 400; opacity: .6; font-size: 13px; margin-left: 6px; }
    .toolbar-user { font-size: 12px; opacity: .7; margin-right: 4px; }

    /* ─── LOGIN VIEW ─── */
    #view-login {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; background: var(--deep);
    }
    .login-wrap { width: 100%; max-width: 420px; padding: 20px; }
    .login-card {
      background: #fff; border-radius: 3px;
      border-top: 5px solid var(--cr); padding: 48px 40px;
    }
    .login-brand {
      font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 20px;
      color: var(--cr); letter-spacing: .06em; margin-bottom: 4px;
    }
    .login-sub { font-size: 14px; color: var(--muted); margin-bottom: 36px; }
    .login-card .btn { width: 100%; justify-content: center; margin-top: 6px; padding: 12px; font-size: 14px; }
    .err-msg { font-size: 13px; color: #dc2626; margin-top: 14px; min-height: 18px; text-align: center; }

    /* ─── POSTS LIST VIEW ─── */
    #view-posts { display: none; }
    .posts-body { padding: 36px; max-width: 900px; margin: 0 auto; }
    .posts-header { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
    .posts-header h2 {
      font-family: 'Oswald', sans-serif; font-weight: 400; font-size: 26px; flex: 1;
    }
    .post-row {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 18px; background: #fff; border: 1px solid var(--line);
      border-radius: 2px; margin-bottom: 8px;
    }
    .post-row:hover { border-color: #c9c1bb; }
    .post-info { flex: 1; min-width: 0; }
    .post-name {
      font-size: 15px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .post-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .posts-empty {
      text-align: center; padding: 72px 24px; color: var(--muted);
      border: 2px dashed var(--line); border-radius: 3px; background: #fff;
    }
    .posts-empty p:first-child { font-size: 40px; margin-bottom: 12px; }
    .posts-empty p { font-size: 15px; }
    .posts-loading { color: var(--muted); font-size: 14px; padding: 40px 0; text-align: center; }

    /* ─── EDITOR VIEW ─── */
    #view-editor { display: none; }
    .editor-wrap { padding: 32px; max-width: 1140px; margin: 0 auto; }
    .editor-layout { display: grid; grid-template-columns: 300px 1fr; gap: 36px; align-items: start; }
    .editor-sidebar {}
    .sidebar-section { background: #fff; border: 1px solid var(--line); border-radius: 2px; padding: 20px; margin-bottom: 16px; }
    .sidebar-section h3 {
      font-family: 'Oswald', sans-serif; font-weight: 400; font-size: 16px;
      margin-bottom: 18px; padding-bottom: 10px; border-bottom: 1px solid var(--line);
    }
    .toggle-row { display: flex; align-items: center; gap: 10px; }
    .toggle-row input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--cr); flex-shrink: 0; }
    .toggle-row label { font-size: 13px; font-weight: 600; cursor: pointer; }
    .toggle-hint { font-size: 11px; color: var(--muted); margin-top: 4px; }
    .editor-main h3 {
      font-family: 'Oswald', sans-serif; font-weight: 400; font-size: 16px;
      margin-bottom: 14px;
    }
    .editor-title-input {
      font-size: 22px; font-weight: 700; padding: 12px 14px;
      border: 1px solid var(--line); border-radius: 2px; width: 100%;
      margin-bottom: 24px;
    }
    .editor-title-input:focus { outline: none; border-color: var(--cr); }

    /* ─── Status banner ─── */
    .status-banner {
      padding: 12px 24px; font-size: 13px; font-weight: 600;
      display: flex; align-items: center; gap: 8px;
    }
    .status-banner.success { background: var(--success-bg); color: var(--success-fg); }
    .status-banner.error   { background: var(--error-bg);   color: var(--error-fg); }

    /* ─── EasyMDE tweaks ─── */
    .EasyMDEContainer .CodeMirror { height: 520px; font-family: 'Inter', ui-monospace, monospace; font-size: 15px; line-height: 1.65; }
    .editor-toolbar { background: var(--paper); border: 1px solid var(--line); }

    /* ─── Responsive ─── */
    @media (max-width: 800px) {
      .editor-layout { grid-template-columns: 1fr; }
      .posts-body, .editor-wrap { padding: 16px; }
      .login-card { padding: 36px 24px; }
    }
  </style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════════════════════
     LOGIN VIEW
══════════════════════════════════════════════════════════════════════════════ -->
<div id="view-login">
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-brand">THE WUSKALOOSA REPORT</div>
      <div class="login-sub">Admin — sign in to manage posts</div>
      <form id="login-form">
        <div class="field">
          <label class="lbl" for="inp-user">Username</label>
          <input id="inp-user" type="text" autocomplete="username" required>
        </div>
        <div class="field">
          <label class="lbl" for="inp-pass">Password</label>
          <input id="inp-pass" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary" type="submit" id="btn-login">SIGN IN →</button>
      </form>
      <p class="err-msg" id="login-err"></p>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════════════════════
     POSTS LIST VIEW
══════════════════════════════════════════════════════════════════════════════ -->
<div id="view-posts">
  <div class="toolbar">
    <div class="toolbar-brand">THE WUSKALOOSA REPORT <span>/ ADMIN</span></div>
    <span class="toolbar-user" id="toolbar-user"></span>
    <button class="btn btn-white" id="btn-new-post">+ New Post</button>
    <button class="btn btn-ghost btn-sm" id="btn-logout">Log Out</button>
  </div>
  <div class="posts-body">
    <div class="posts-header">
      <h2>All Posts</h2>
    </div>
    <div id="posts-list"></div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════════════════════
     EDITOR VIEW
══════════════════════════════════════════════════════════════════════════════ -->
<div id="view-editor">
  <div class="toolbar">
    <div class="toolbar-brand" id="editor-toolbar-title">New Post</div>
    <button class="btn btn-ghost btn-sm" id="btn-back">← All Posts</button>
    <button class="btn btn-white" id="btn-publish">Publish</button>
  </div>
  <div id="status-banner" class="status-banner hidden"></div>
  <div class="editor-wrap">
    <input
      id="f-title"
      class="editor-title-input"
      type="text"
      placeholder="Post title…"
      autocomplete="off"
    >
    <div class="editor-layout">
      <!-- Sidebar -->
      <div class="editor-sidebar">
        <div class="sidebar-section">
          <h3>Details</h3>
          <div class="field">
            <label class="lbl" for="f-slug">URL Slug</label>
            <input id="f-slug" type="text" placeholder="my-post-slug" autocomplete="off">
          </div>
          <div class="field">
            <label class="lbl" for="f-date">Publish Date</label>
            <input id="f-date" type="datetime-local">
          </div>
          <div class="field">
            <label class="lbl" for="f-category">Category</label>
            <select id="f-category">
              <option>Latest Take</option>
              <option>Analysis</option>
              <option>Preview</option>
              <option>Recap</option>
              <option>Culture</option>
              <option>Opinion</option>
            </select>
          </div>
        </div>
        <div class="sidebar-section">
          <h3>Summary</h3>
          <div class="field" style="margin-bottom:0">
            <label class="lbl" for="f-excerpt">Excerpt</label>
            <textarea id="f-excerpt" rows="4" placeholder="One or two lines shown in post previews…"></textarea>
          </div>
        </div>
        <div class="sidebar-section">
          <h3>Homepage</h3>
          <div class="toggle-row">
            <input type="checkbox" id="f-featured">
            <label for="f-featured">Feature on Homepage</label>
          </div>
          <p class="toggle-hint" style="margin-top:6px">Only one post should be featured at a time.</p>
        </div>
        <button class="btn btn-danger btn-sm hidden" id="btn-delete-post" style="margin-top:4px;width:100%;justify-content:center">
          Delete Post
        </button>
      </div>
      <!-- Body editor -->
      <div class="editor-main">
        <h3>Article Body</h3>
        <textarea id="f-body"></textarea>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/easymde/2.18.0/easymde.min.js"></script>
<script>
// ═════════════════════════════════════════════════════════════════════════════
// CONFIGURATION
// ─────────────────────────────────────────────────────────────────────────────
// After deploying the Cloudflare Worker, paste its URL here:
const API_URL = 'https://wuskaloosa-admin.YOUR-ACCOUNT.workers.dev';
// ═════════════════════════════════════════════════════════════════════════════

/* ── State ── */
let token    = localStorage.getItem('wkr_token') || null;
let username = localStorage.getItem('wkr_user')  || null;
let mde      = null;   // EasyMDE instance
let editFile = null;   // filename currently being edited (null = new post)
let editSha  = null;   // GitHub SHA for the current file

/* ── API helper ── */
async function api(method, path, body) {
  const headers = { 'Content-Type': 'application/json' };
  if (token) headers['Authorization'] = `Bearer ${token}`;
  const res = await fetch(`${API_URL}${path}`, {
    method,
    headers,
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  if (res.status === 401) { logout(); throw new Error('Session expired — please sign in again.'); }
  const data = await res.json().catch(() => ({ error: `HTTP ${res.status}` }));
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

/* ── Views ── */
function showView(id) {
  for (const v of ['view-login', 'view-posts', 'view-editor'])
    document.getElementById(v).style.display = v === id
      ? (v === 'view-login' ? 'flex' : 'block')
      : 'none';
}

/* ── Status banner ── */
function showBanner(type, msg) {
  const el = document.getElementById('status-banner');
  el.className = `status-banner ${type}`;
  el.textContent = msg;
  el.classList.remove('hidden');
  if (type === 'success') setTimeout(() => el.classList.add('hidden'), 8000);
}
function hideBanner() { document.getElementById('status-banner').classList.add('hidden'); }

/* ────────────────────────────────────────────────────────────
   LOGIN
────────────────────────────────────────────────────────────── */
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('login-err');
  const btn   = document.getElementById('btn-login');
  errEl.textContent   = '';
  btn.textContent     = 'Signing in…';
  btn.disabled        = true;

  if (API_URL.includes('YOUR-ACCOUNT')) {
    errEl.textContent = 'Set API_URL in admin/index.html first.';
    btn.textContent = 'SIGN IN →'; btn.disabled = false; return;
  }

  try {
    const u = document.getElementById('inp-user').value.trim();
    const p = document.getElementById('inp-pass').value;
    const res = await fetch(`${API_URL}/api/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Login failed');
    token    = data.token;
    username = data.username;
    localStorage.setItem('wkr_token', token);
    localStorage.setItem('wkr_user',  username);
    loadPostList();
  } catch (err) {
    errEl.textContent = err.message === 'Invalid credentials'
      ? 'Wrong username or password.'
      : `Error: ${err.message}`;
    btn.textContent = 'SIGN IN →';
    btn.disabled    = false;
  }
});

/* ────────────────────────────────────────────────────────────
   POST LIST
────────────────────────────────────────────────────────────── */
async function loadPostList() {
  showView('view-posts');
  const toolbarUser = document.getElementById('toolbar-user');
  toolbarUser.textContent = username ? `Signed in as ${username}` : '';

  const listEl = document.getElementById('posts-list');
  listEl.innerHTML = '<p class="posts-loading">Loading posts…</p>';

  try {
    const posts = await api('GET', '/api/posts');
    if (!posts.length) {
      listEl.innerHTML = `
        <div class="posts-empty">
          <p>🏈</p>
          <p>No posts yet — write your first take!</p>
        </div>`;
      return;
    }
    listEl.innerHTML = posts.map(p => {
      // Derive human label from filename: 2026-08-22-my-slug.md
      const parts  = p.name.replace('.md', '').split('-');
      const dateStr = parts.length >= 3 ? `${parts[0]}-${parts[1]}-${parts[2]}` : '';
      const rawLabel = parts.slice(3).join(' ') || p.name;
      const label  = rawLabel.charAt(0).toUpperCase() + rawLabel.slice(1);
      const disp   = dateStr
        ? new Date(dateStr + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
        : '';
      return `
        <div class="post-row">
          <div class="post-info">
            <div class="post-name">${label}</div>
            ${disp ? `<div class="post-meta">${disp} &middot; ${p.name}</div>` : `<div class="post-meta">${p.name}</div>`}
          </div>
          <button class="btn btn-outline btn-sm" onclick="openEditPost('${p.name}','${p.sha}')">Edit</button>
          <button class="btn btn-danger btn-sm" onclick="confirmDelete('${p.name}','${p.sha}')">Delete</button>
        </div>`;
    }).join('');
  } catch (err) {
    listEl.innerHTML = `<p style="color:#dc2626;font-size:14px;padding:24px 0">Error: ${err.message}</p>`;
  }
}

document.getElementById('btn-new-post').addEventListener('click', () => openEditor(null, null, null));
document.getElementById('btn-logout').addEventListener('click', logout);

function logout() {
  token = null; username = null;
  localStorage.removeItem('wkr_token');
  localStorage.removeItem('wkr_user');
  showView('view-login');
}

async function confirmDelete(filename, sha) {
  if (!confirm(`Delete "${filename}"?\n\nThis cannot be undone and will trigger a site rebuild.`)) return;
  try {
    await api('DELETE', `/api/posts/${filename}?sha=${encodeURIComponent(sha)}`);
    loadPostList();
  } catch (err) {
    alert(`Delete failed: ${err.message}`);
  }
}

/* ────────────────────────────────────────────────────────────
   EDITOR
────────────────────────────────────────────────────────────── */

// Auto-slug from title (new posts only)
document.getElementById('f-title').addEventListener('input', () => {
  if (editFile) return;
  document.getElementById('f-slug').value = document.getElementById('f-title').value
    .toLowerCase()
    .replace(/[^a-z0-9\s-]/g, '')
    .replace(/\s+/g, '-')
    .replace(/-+/g, '-')
    .replace(/^-+|-+$/g, '');
});

function initMDE() {
  if (mde) return;
  mde = new EasyMDE({
    element:      document.getElementById('f-body'),
    spellChecker: false,
    placeholder:  'Write your take here…',
    toolbar: [
      'bold','italic','heading','|',
      'quote','unordered-list','ordered-list','|',
      'link','|',
      'preview','side-by-side','fullscreen','|','guide'
    ],
    status: ['lines', 'words'],
    renderingConfig: { singleLineBreaks: false },
  });
}

function openEditor(filename, sha, content) {
  editFile = filename;
  editSha  = sha;
  initMDE();
  hideBanner();

  const isNew = !filename;
  document.getElementById('editor-toolbar-title').textContent = isNew ? 'New Post' : 'Edit Post';
  const delBtn = document.getElementById('btn-delete-post');
  isNew ? delBtn.classList.add('hidden') : delBtn.classList.remove('hidden');
  delBtn.onclick = () => {
    if (confirm(`Delete "${editFile}"?\n\nThis cannot be undone.`)) {
      api('DELETE', `/api/posts/${editFile}?sha=${encodeURIComponent(editSha)}`)
        .then(() => loadPostList())
        .catch(err => alert(`Delete failed: ${err.message}`));
    }
  };

  if (content) {
    const { data, body } = parseFrontmatter(content);
    document.getElementById('f-title').value    = data.title    || '';
    document.getElementById('f-slug').value     = data.slug     || '';
    document.getElementById('f-excerpt').value  = data.excerpt  || '';
    document.getElementById('f-featured').checked = data.featured === 'true' || data.featured === true;
    const cats = ['Latest Take','Analysis','Preview','Recap','Culture','Opinion'];
    document.getElementById('f-category').value = cats.includes(data.category) ? data.category : 'Latest Take';
    if (data.date) {
      const d = new Date(data.date);
      document.getElementById('f-date').value = toLocalInput(d);
    } else {
      document.getElementById('f-date').value = toLocalInput(new Date());
    }
    mde.value(body || '');
  } else {
    document.getElementById('f-title').value    = '';
    document.getElementById('f-slug').value     = '';
    document.getElementById('f-excerpt').value  = '';
    document.getElementById('f-featured').checked = false;
    document.getElementById('f-category').value = 'Latest Take';
    document.getElementById('f-date').value     = toLocalInput(new Date());
    mde.value('');
  }

  showView('view-editor');
  setTimeout(() => mde.codemirror.refresh(), 60);
  document.getElementById('f-title').focus();
}

async function openEditPost(filename, sha) {
  try {
    const { content, sha: freshSha } = await api('GET', `/api/posts/${filename}`);
    openEditor(filename, freshSha, content);
  } catch (err) {
    alert(`Could not load post: ${err.message}`);
  }
}

document.getElementById('btn-back').addEventListener('click', () => {
  if (confirm('Go back? Unsaved changes will be lost.')) loadPostList();
});

document.getElementById('btn-publish').addEventListener('click', async () => {
  const title    = document.getElementById('f-title').value.trim();
  const slug     = document.getElementById('f-slug').value.trim();
  const excerpt  = document.getElementById('f-excerpt').value.trim();
  const category = document.getElementById('f-category').value;
  const featured = document.getElementById('f-featured').checked;
  const dateVal  = document.getElementById('f-date').value;
  const body     = mde.value().trim();

  if (!title)   { showBanner('error', 'Title is required.'); return; }
  if (!slug)    { showBanner('error', 'URL Slug is required.'); return; }
  if (!dateVal) { showBanner('error', 'Publish date is required.'); return; }

  const dateISO  = new Date(dateVal).toISOString();
  const filename = editFile || makeFilename(slug, dateVal);
  const content  = buildFrontmatter({ title, slug, date: dateISO, excerpt, category, featured }) + body;

  const btn = document.getElementById('btn-publish');
  btn.textContent = 'Publishing…'; btn.disabled = true;
  hideBanner();

  try {
    const result = await api('POST', `/api/posts/${filename}`, {
      content,
      sha: editSha || undefined,
    });
    editFile = filename;
    editSha  = result.sha; // Worker returns updated SHA
    document.getElementById('editor-toolbar-title').textContent = 'Edit Post';
    document.getElementById('btn-delete-post').classList.remove('hidden');
    showBanner('success', '✓ Published! Your site will rebuild in about a minute. Roll Tide 🏈');
  } catch (err) {
    showBanner('error', `Error: ${err.message}`);
  } finally {
    btn.textContent = 'Publish'; btn.disabled = false;
  }
});

/* ────────────────────────────────────────────────────────────
   HELPERS
────────────────────────────────────────────────────────────── */

function parseFrontmatter(raw) {
  const m = raw.match(/^---\s*\n([\s\S]*?)\n---\s*\n?([\s\S]*)$/);
  if (!m) return { data: {}, body: raw };
  const data = {};
  m[1].split('\n').forEach(line => {
    const i = line.indexOf(':');
    if (i < 0) return;
    const key = line.slice(0, i).trim();
    const val = line.slice(i + 1).trim().replace(/^["']|["']$/g, '');
    data[key] = val;
  });
  return { data, body: m[2].trim() };
}

function buildFrontmatter({ title, slug, date, excerpt, category, featured }) {
  const q = v => `"${String(v).replace(/\\/g, '\\\\').replace(/"/g, '\\"')}"`;
  return [
    '---',
    `title: ${q(title)}`,
    `slug: ${q(slug)}`,
    `date: "${date}"`,
    `excerpt: ${q(excerpt)}`,
    `category: "${category}"`,
    `featured: ${featured}`,
    '---',
    '',
    '',
  ].join('\n');
}

function makeFilename(slug, dateVal) {
  const d   = new Date(dateVal);
  const y   = d.getFullYear();
  const mo  = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${mo}-${day}-${slug}.md`;
}

function toLocalInput(date) {
  return new Date(date - date.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
}
