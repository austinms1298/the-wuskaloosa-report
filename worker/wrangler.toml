name = "wuskaloosa-admin"
main = "worker.js"
compatibility_date = "2024-11-01"

# After running `wrangler deploy`, set these secrets:
#
#   wrangler secret put USER1_USERNAME   (your username)
#   wrangler secret put USER1_PASSWORD   (your password)
#   wrangler secret put USER2_USERNAME   (jackie's username)
#   wrangler secret put USER2_PASSWORD   (jackie's password)
#   wrangler secret put GITHUB_PAT       (GitHub fine-grained PAT)
#   wrangler secret put JWT_SECRET       (any long random string)
#   wrangler secret put CF_ANALYTICS_TOKEN  (Cloudflare API token scoped to Account Analytics: Read only)
#
# Your worker URL will be:
#   https://wuskaloosa-admin.YOUR-ACCOUNT.workers.dev
#
# Paste that URL into the API_URL constant in public/admin/index.html

# ── Email list KV (run once to create, then paste the id below) ───────────────
#   cd worker && wrangler kv namespace create EMAIL_LIST
#   → paste the returned "id" value below
[[kv_namespaces]]
binding = "EMAIL_LIST"
id      = "43b9e05a80394e9086afa444f03bdd31"

# ── Comments D1 database ───────────────────────────────────────────────────────
# See worker/COMMENTS_SETUP.md for the full walkthrough. In short:
#   cd worker && wrangler d1 create wuskaloosa-comments
#   → paste the returned "database_id" below
#   wrangler d1 execute wuskaloosa-comments --remote --file=schema.sql
[[d1_databases]]
binding       = "DB"
database_name = "wuskaloosa-comments"
database_id   = "6057ef89-aae9-4fed-a7f9-f899c1900a35"

# Optional secret for comments (after `wrangler deploy`):
#   wrangler secret put TURNSTILE_SECRET_KEY   (omit entirely to run without Turnstile)
